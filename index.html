<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Студия Точка — телесуфлёр</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121a;color:#eef0f8;font:16px system-ui}header{padding:18px 24px;border-bottom:1px solid #303444;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px}aside{background:#1c2030;padding:20px;border-radius:16px}label{display:block;margin:16px 0 6px;color:#c9ccdc}textarea,select,input[type=number]{width:100%;background:#10121a;color:white;border:1px solid #454b62;border-radius:8px;padding:9px}textarea{height:220px;resize:vertical}button,.download{background:#6460ec;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none;margin:5px 4px 5px 0}button:disabled{opacity:.4;cursor:default}input[type=range]{width:100%}.check{display:flex;gap:8px;align-items:center}.stage{position:relative;background:#050609;border-radius:16px;overflow:hidden;height:calc(100vh - 140px);min-height:450px}.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}.viewport{position:absolute;inset:0;overflow:hidden}.script{padding:40vh 7% 70vh;white-space:pre-wrap;line-height:1.5;font-weight:600;position:relative;will-change:transform}.guide{position:absolute;top:35%;width:100%;border-top:2px solid #f5c65c;pointer-events:none;opacity:.6}.toolbar{position:absolute;bottom:0;left:0;right:0;background:#10121ae8;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.status{font-size:14px;color:#c9ccdc;line-height:1.5}#error{color:#ffb3b3}meter{width:100%}.stage:fullscreen{height:100vh;border-radius:0}@media(max-width:850px){main{grid-template-columns:1fr}.stage{height:70vh}aside{order:2}}small{color:#abb1c9}
</style>
<header><h1>Студия Точка <small>телесуфлёр</small></h1><span id="clock">00:00</span></header>
<main><aside>
<label for="editor">Текст выступления</label><textarea id="editor" placeholder="Вставьте текст…"></textarea>
<button id="load">Открыть .txt</button><input id="file" type="file" accept=".txt,text/plain" hidden>
<label for="speed">Скорость: <span id="speedValue"></span> пикс./с</label><input id="speed" type="range" min="5" max="180" value="40">
<label for="size">Размер текста: <span id="sizeValue"></span> px</label><input id="size" type="range" min="24" max="100" value="48">
<label class="check"><input id="mirror" type="checkbox"> Зеркальный текст</label>
<label class="check"><input id="preview" type="checkbox" checked> Показывать камеру под текстом</label>
<label for="camera">Камера</label><select id="camera"><option value="">По умолчанию</option></select>
<label for="mic">Микрофон / RØDE</label><select id="mic"><option value="">По умолчанию</option></select>
<button id="connect">Подключить камеру и звук</button>
<label>Уровень микрофона</label><meter id="level" min="0" max="1" value="0"></meter>
<p class="status">Подключите приёмник RØDE по USB, затем разрешите доступ и выберите его в списке микрофонов. Точное подключение зависит от модели.</p>
<p class="status">Записываются камера и выбранный микрофон. Текст суфлёра остаётся только на экране.</p>
<p id="error" class="status" role="alert"></p><div id="downloads"></div>
</aside><section class="stage" id="stage"><video id="video" autoplay playsinline muted></video><div class="viewport" id="viewport"><div class="script" id="script"></div></div><div class="guide"></div><div class="toolbar"><button id="play">▶ Читать</button><button id="reset">В начало</button><button id="record" disabled>● Запись</button><button id="stop" disabled>■ Стоп</button><button id="full">Полный экран</button><span id="state" role="status">Готово</span></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let offset=0,playing=false,last=0,stream=null,recorder=null,chunks=[],audioContext=null,analyser=null,recordStart=0,urls=[];
const error=m=>$('error').textContent=m;
try{$('editor').value=localStorage.getItem('tochka-text')||'Добро пожаловать в Студию Точка!\n\nВставьте свой текст, настройте скорость и нажмите «Читать».\n\nПодключите камеру и микрофон, чтобы записать выступление.'}catch(e){$('editor').value='Добро пожаловать в Студию Точка!'}
function render(){ $('script').textContent=$('editor').value;$('script').style.fontSize=$('size').value+'px';$('script').style.transform=`translateY(${-offset}px) scaleX(${$('mirror').checked?-1:1})`;$('speedValue').textContent=$('speed').value;$('sizeValue').textContent=$('size').value;$('video').style.display=$('preview').checked?'block':'none';}
function toggle(){playing=!playing;$('play').textContent=playing?'Ⅱ Пауза':'▶ Читать'}
$('play').onclick=toggle;$('reset').onclick=()=>{offset=0;render()};
for(const id of ['editor','speed','size','mirror','preview'])$(id).addEventListener('input',()=>{if(id==='editor'){try{localStorage.setItem('tochka-text',$('editor').value)}catch(e){}}render()});
$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(f){$('editor').value=await f.text();$('editor').dispatchEvent(new Event('input'));offset=0;render()}};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen()}catch(e){error('Не удалось открыть полный экран: '+e.message)}};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='Home'){offset=0;render()}if(e.code==='ArrowUp'){e.preventDefault();offset=Math.max(0,offset-80);render()}if(e.code==='ArrowDown'){e.preventDefault();offset+=80;render()}});
$('viewport').addEventListener('wheel',e=>{e.preventDefault();offset=Math.max(0,Math.min($('script').offsetHeight-$('viewport').clientHeight,offset+e.deltaY));render()},{passive:false});
async function devices(){const list=await navigator.mediaDevices.enumerateDevices();for(const [id,kind] of [['camera','videoinput'],['mic','audioinput']]){const chosen=$(id).value;$(id).replaceChildren(new Option('По умолчанию',''));list.filter(d=>d.kind===kind).forEach((d,i)=>$(id).add(new Option(d.label||`${id==='mic'?'Микрофон':'Камера'} ${i+1}`,d.deviceId)));if([...$(id).options].some(o=>o.value===chosen))$(id).value=chosen}}
async function release(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioContext){await audioContext.close();audioContext=null;analyser=null}}
$('connect').onclick=async()=>{error('');$('connect').disabled=true;$('record').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Доступ к камере требует localhost или HTTPS.');await release();stream=await navigator.mediaDevices.getUserMedia({video:$('camera').value?{deviceId:{exact:$('camera').value}}:true,audio:{...($('mic').value?{deviceId:{exact:$('mic').value}}:{}),echoCancellation:false,noiseSuppression:false,autoGainControl:false}});$('video').srcObject=stream;await devices();try{audioContext=new AudioContext();await audioContext.resume();analyser=audioContext.createAnalyser();analyser.fftSize=512;audioContext.createMediaStreamSource(stream).connect(analyser)}catch(e){error('Камера и звук подключены, но индикатор уровня недоступен.')}if(typeof MediaRecorder==='undefined')throw new Error('Браузер не поддерживает запись. Откройте в Edge или Chrome.');$('record').disabled=false;$('state').textContent='Камера и звук подключены'}catch(e){error('Не удалось подключить: '+e.message)}finally{$('connect').disabled=false}};
$('record').onclick=()=>{error('');if(!stream||!stream.getTracks().every(t=>t.readyState==='live')){error('Подключите камеру и микрофон заново.');return}try{const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));chunks=[];recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=e=>error('Ошибка записи: '+(e.error?.message||'неизвестная ошибка'));recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});const url=URL.createObjectURL(blob);urls.push(url);const link=document.createElement('a');link.className='download';link.href=url;link.download='Студия-Точка-'+new Date().toISOString().replace(/[:.]/g,'-')+(blob.type.includes('mp4')?'.mp4':'.webm');link.textContent='Скачать запись ('+(blob.size/1048576).toFixed(1)+' МБ)';$('downloads').prepend(link);$('record').disabled=false;$('stop').disabled=true;$('connect').disabled=false;$('camera').disabled=false;$('mic').disabled=false;$('state').textContent='Запись готова — сохраните файл';recordStart=0};recorder.start(1000);recordStart=Date.now();$('record').disabled=true;$('stop').disabled=false;$('connect').disabled=true;$('camera').disabled=true;$('mic').disabled=true;$('state').textContent='● Идёт запись'}catch(e){error('Не удалось начать запись: '+e.message)}};
$('stop').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();$('stop').disabled=true;$('state').textContent='Подготовка файла…'}};
window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'||urls.length){e.preventDefault();e.returnValue=''}});
function frame(t){const dt=last?Math.min((t-last)/1000,.1):0;last=t;if(playing){offset+=dt*Number($('speed').value);const max=Math.max(0,$('script').offsetHeight-$('viewport').clientHeight);if(offset>=max){offset=max;toggle()}render()}if(analyser){const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);$('level').value=Math.min(1,Math.sqrt(data.reduce((s,v)=>s+((v-128)/128)**2,0)/data.length)*3)}if(recordStart){const seconds=Math.floor((Date.now()-recordStart)/1000);$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></html>
